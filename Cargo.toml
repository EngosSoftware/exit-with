[package]
name = "exit-with"
version = "0.2.6"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "Exit with code, stdout & stderr"
documentation = "https://docs.rs/exit-with"
repository = "https://github.com/EngosSoftware/exit-with.git"
keywords = ["exit", "with", "code", "stdout", "stderr"]
homepage = "https://engossoftware.github.io/exit-with/"
categories = ["command-line-utilities"]
rust-version = "1.88.0"
edition = "2024"
license = "MIT OR Apache-2.0"
include = [
    "src/**",
    "docs/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]

[dev-dependencies]
cli-assert = "0.1.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
